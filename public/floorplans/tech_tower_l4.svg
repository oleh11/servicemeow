<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0b1120; font-family: ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <!-- Architectural Grid Pattern -->
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#cadGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.8"/>
    </pattern>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Grids -->
  <rect width="1000" height="600" fill="#090d16"/>
  <rect width="1000" height="600" fill="url(#majorGrid)"/>

  <!-- Blueprint Header / Border Metadata -->
  <rect x="15" y="15" width="970" height="570" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.3"/>
  <text x="35" y="38" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">TECH TOWER • LEVEL 4 WORKPLACE HUB ARCHITECTURAL SCHEMATIC</text>
  <text x="750" y="38" fill="#94a3b8" font-size="11" font-family="monospace">SCALE: 1:100 • DWG-REF: MEOW-L4-2026</text>

  <!-- Outer Building Boundary Walls -->
  <rect x="30" y="45" width="940" height="510" fill="none" stroke="#64748b" stroke-width="4" rx="4"/>

  <!-- Central Circulation Corridor -->
  <path d="M 170 270 L 760 270 M 310 45 L 310 555 M 750 45 L 750 555" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="480" y="305" fill="#475569" font-size="11" letter-spacing="3" text-anchor="middle" font-weight="600">MAIN CIRCULATION ATRIUM</text>

  <!-- ROOM: CONF-410 (Executive Boardroom) -->
  <g id="svg-room-conf-410">
    <rect x="40" y="55" width="260" height="205" fill="#0f172a" stroke="#0284c7" stroke-width="2.5" rx="3"/>
    <text x="55" y="85" fill="#38bdf8" font-size="14" font-weight="700">CONF-410</text>
    <text x="55" y="105" fill="#94a3b8" font-size="11">Executive Boardroom</text>
    <text x="55" y="125" fill="#64748b" font-size="10">Cap: 20 • Teams / Zoom / 4K</text>
    <!-- Conference Table Graphic -->
    <rect x="100" y="130" width="140" height="65" rx="30" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <circle cx="120" cy="115" r="4" fill="#64748b"/>
    <circle cx="150" cy="115" r="4" fill="#64748b"/>
    <circle cx="180" cy="115" r="4" fill="#64748b"/>
    <circle cx="210" cy="115" r="4" fill="#64748b"/>
    <circle cx="120" cy="210" r="4" fill="#64748b"/>
    <circle cx="150" cy="210" r="4" fill="#64748b"/>
    <circle cx="180" cy="210" r="4" fill="#64748b"/>
    <circle cx="210" cy="210" r="4" fill="#64748b"/>
    <!-- Door Swing Arc -->
    <path d="M 280 260 A 25 25 0 0 0 300 235" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="280" y1="260" x2="280" y2="235" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- ROOM: CONF-405 (Teams Huddle) -->
  <g id="svg-room-conf-405">
    <rect x="330" y="55" width="190" height="135" fill="#0f172a" stroke="#0284c7" stroke-width="2" rx="3"/>
    <text x="345" y="80" fill="#38bdf8" font-size="13" font-weight="700">CONF-405</text>
    <text x="345" y="98" fill="#94a3b8" font-size="11">Agile Teams Huddle</text>
    <text x="345" y="115" fill="#64748b" font-size="10">Cap: 6 • Teams / Whiteboard</text>
    <!-- Huddle Table -->
    <rect x="380" y="125" width="80" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <!-- Door Swing Arc -->
    <path d="M 330 170 A 20 20 0 0 1 350 190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- ROOM: CONF-408 (Zoom Studio Suite) -->
  <g id="svg-room-conf-408">
    <rect x="540" y="55" width="190" height="135" fill="#0f172a" stroke="#0284c7" stroke-width="2" rx="3"/>
    <text x="555" y="80" fill="#38bdf8" font-size="13" font-weight="700">CONF-408</text>
    <text x="555" y="98" fill="#94a3b8" font-size="11">Zoom Studio Suite</text>
    <text x="555" y="115" fill="#64748b" font-size="10">Cap: 8 • Zoom / Telepresence</text>
    <!-- Studio Arc Table -->
    <path d="M 580 155 Q 635 125 690 155" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
    <!-- Door Swing Arc -->
    <path d="M 710 190 A 20 20 0 0 0 730 170" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- ROOM: CONF-420 (Global Hybrid Arena) -->
  <g id="svg-room-conf-420">
    <rect x="750" y="55" width="210" height="490" fill="#0f172a" stroke="#0284c7" stroke-width="2.5" rx="3"/>
    <text x="765" y="85" fill="#38bdf8" font-size="14" font-weight="700">CONF-420</text>
    <text x="765" y="105" fill="#94a3b8" font-size="11">Global Hybrid Arena</text>
    <text x="765" y="125" fill="#64748b" font-size="10">Cap: 60 • Teams / Zoom / All-Hands</text>
    <!-- Auditorium Curved Seating Tiers -->
    <path d="M 780 200 Q 855 240 930 200" fill="none" stroke="#334155" stroke-width="4"/>
    <path d="M 780 240 Q 855 280 930 240" fill="none" stroke="#334155" stroke-width="4"/>
    <path d="M 780 280 Q 855 320 930 280" fill="none" stroke="#334155" stroke-width="4"/>
    <path d="M 780 320 Q 855 360 930 320" fill="none" stroke="#334155" stroke-width="4"/>
    <!-- Stage Area -->
    <rect x="800" y="420" width="110" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="855" y="455" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">MAIN STAGE</text>
    <!-- Double Doors -->
    <line x1="750" y1="270" x2="750" y2="330" stroke="#0b1120" stroke-width="4"/>
    <path d="M 750 270 A 30 30 0 0 1 780 300" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <path d="M 750 330 A 30 30 0 0 0 780 300" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- WORKSTATION POD ZONE: STANDING DESKS (401, 402, 403) -->
  <g id="svg-desks-zone">
    <rect x="330" y="210" width="390" height="95" fill="#0c1322" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" rx="4"/>
    <text x="345" y="230" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1">HOT DESK &amp; STANDING DESK ROW</text>

    <!-- DESK-401 -->
    <g id="svg-desk-401">
      <rect x="345" y="240" width="105" height="52" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="355" y="260" fill="#38bdf8" font-size="11" font-weight="700">DESK-401</text>
      <text x="355" y="275" fill="#94a3b8" font-size="9">Standing • Teams</text>
      <rect x="425" y="248" width="18" height="14" rx="2" fill="#38bdf8" opacity="0.4"/>
      <circle cx="397" cy="285" r="4" fill="#64748b"/>
    </g>

    <!-- DESK-402 -->
    <g id="svg-desk-402">
      <rect x="470" y="240" width="105" height="52" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="480" y="260" fill="#38bdf8" font-size="11" font-weight="700">DESK-402</text>
      <text x="480" y="275" fill="#94a3b8" font-size="9">Standing • Zoom</text>
      <rect x="550" y="248" width="18" height="14" rx="2" fill="#38bdf8" opacity="0.4"/>
      <circle cx="522" cy="285" r="4" fill="#64748b"/>
    </g>

    <!-- DESK-403 -->
    <g id="svg-desk-403">
      <rect x="595" y="240" width="105" height="52" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="605" y="260" fill="#38bdf8" font-size="11" font-weight="700">DESK-403</text>
      <text x="605" y="275" fill="#94a3b8" font-size="9">Standing • Dual 4K</text>
      <rect x="675" y="248" width="18" height="14" rx="2" fill="#38bdf8" opacity="0.4"/>
      <circle cx="647" cy="285" r="4" fill="#64748b"/>
    </g>
  </g>

  <!-- ROOM: POD-415 (Acoustic Focus Pod) -->
  <g id="svg-room-pod-415">
    <rect x="40" y="280" width="130" height="265" fill="#0f172a" stroke="#0284c7" stroke-width="2" rx="3"/>
    <text x="55" y="310" fill="#38bdf8" font-size="13" font-weight="700">POD-415</text>
    <text x="55" y="328" fill="#94a3b8" font-size="11">Acoustic Quiet Pod</text>
    <text x="55" y="345" fill="#64748b" font-size="10">Cap: 2 • Privacy</text>
    <!-- Ergonomic Pod Sofa -->
    <rect x="65" y="420" width="80" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <!-- Door Swing Arc -->
    <path d="M 170 340 A 20 20 0 0 1 150 360" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- ROOM: LAB-430 (Hardware & IoT Lab) -->
  <g id="svg-room-lab-430">
    <rect x="190" y="320" width="240" height="225" fill="#0f172a" stroke="#0284c7" stroke-width="2" rx="3"/>
    <text x="205" y="345" fill="#38bdf8" font-size="13" font-weight="700">LAB-430</text>
    <text x="205" y="365" fill="#94a3b8" font-size="11">Hardware &amp; IoT Lab</text>
    <text x="205" y="382" fill="#64748b" font-size="10">Cap: 12 • Standing Benches</text>
    <!-- Lab Workbenches -->
    <rect x="215" y="410" width="90" height="45" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <rect x="325" y="410" width="90" height="45" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <!-- Door Swing Arc -->
    <path d="M 400 320 A 20 20 0 0 0 420 340" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- ROOM: LOUNGE-450 (Breakout Commons) -->
  <g id="svg-room-lounge-450">
    <rect x="450" y="320" width="280" height="225" fill="#0f172a" stroke="#0284c7" stroke-width="2" rx="3"/>
    <text x="465" y="345" fill="#38bdf8" font-size="13" font-weight="700">LOUNGE-450</text>
    <text x="465" y="365" fill="#94a3b8" font-size="11">Commons &amp; Team Lounge</text>
    <text x="465" y="382" fill="#64748b" font-size="10">Cap: 25 • Cafe &amp; Whiteboard</text>
    <!-- Lounge Sofas & Cafe Tables -->
    <circle cx="510" cy="430" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="590" cy="430" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="670" cy="430" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <!-- Open Access Pathway -->
    <line x1="480" y1="320" x2="560" y2="320" stroke="#0b1120" stroke-width="4"/>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(930, 80)">
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <polygon points="0,-14 4,-3 0,0 -4,-3" fill="#38bdf8"/>
    <polygon points="0,14 4,3 0,0 -4,3" fill="#64748b"/>
    <text x="0" y="-18" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">N</text>
  </g>
</svg>
