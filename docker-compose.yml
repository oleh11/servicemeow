services:
  postgres:
    image: postgres:16-alpine
    container_name: servicemeow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-servicemeow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-servicemeow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  servicemeow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicemeow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-servicemeow}?schema=public
      - AUTH_SECRET=${AUTH_SECRET:-purr-secret-jwt-signing-key-servicemeow-prod-2026-super-strong-auth-32chars}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicemeow-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-servicemeow}?schema=public
      - AUTH_SECRET=${AUTH_SECRET:-purr-secret-jwt-signing-key-servicemeow-prod-2026-super-strong-auth-32chars}
      - WORKER_INTERVAL_MS=15000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
