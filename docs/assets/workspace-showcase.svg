<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="100%" height="100%">
  <defs>
    <linearGradient id="wBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="aiCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <filter id="wShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="660" rx="14" fill="url(#wBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Window Header / Title Bar -->
  <g transform="translate(0, 0)">
    <path d="M 0 14 C 0 6 6 0 14 0 L 1086 0 C 1094 0 1100 6 1100 14 L 1100 44 L 0 44 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Traffic lights -->
    <circle cx="24" cy="22" r="5" fill="#ef4444"/>
    <circle cx="40" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="22" r="5" fill="#10b981"/>
    <!-- Title -->
    <text x="80" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">ServiceMeow Fulfiller Workspace — Incident Command Center</text>
    <!-- Right Avatar / Impersonation Badge -->
    <rect x="940" y="10" width="140" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="954" cy="22" r="7" fill="#38bdf8"/>
    <text x="968" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Admin Cat (admin)</text>
  </g>

  <!-- Dockable Tabs Bar -->
  <g transform="translate(64, 44)">
    <rect width="1036" height="38" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>

    <!-- Tab 1: Active Incident -->
    <g transform="translate(8, 6)">
      <rect width="210" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="20" cy="16" r="4" fill="#ef4444"/>
      <text x="32" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">INC0010042 (P1 Critical)</text>
      <text x="194" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">×</text>
    </g>

    <!-- Tab 2: CMDB Topology -->
    <g transform="translate(226, 6)">
      <rect width="190" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Topology: prod-db-01</text>
      <text x="174" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">×</text>
    </g>

    <!-- Tab 3: Change Request -->
    <g transform="translate(424, 6)">
      <rect width="180" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">CHG0004018 (Emergency)</text>
      <text x="164" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">×</text>
    </g>

    <text x="618" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">+</text>
  </g>

  <!-- Left M3 Navigation Rail -->
  <g transform="translate(0, 44)">
    <rect width="64" height="616" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
    <!-- Icon 1: Workspace Active -->
    <rect x="12" y="16" width="40" height="40" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="32" y="40" font-size="18" text-anchor="middle">📋</text>
    <!-- Icon 2: Kanban -->
    <rect x="12" y="68" width="40" height="40" rx="12" fill="#0f172a"/>
    <text x="32" y="92" font-size="18" text-anchor="middle">📊</text>
    <!-- Icon 3: CMDB -->
    <rect x="12" y="120" width="40" height="40" rx="12" fill="#0f172a"/>
    <text x="32" y="144" font-size="18" text-anchor="middle">🖥️</text>
    <!-- Icon 4: Studio -->
    <rect x="12" y="172" width="40" height="40" rx="12" fill="#0f172a"/>
    <text x="32" y="196" font-size="18" text-anchor="middle">⚙️</text>
    <!-- Icon 5: Portal -->
    <rect x="12" y="224" width="40" height="40" rx="12" fill="#0f172a"/>
    <text x="32" y="248" font-size="18" text-anchor="middle">🌐</text>
  </g>

  <!-- Main Record Form Area -->
  <g transform="translate(80, 96)">
    <!-- Record Form Header -->
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">INC0010042 — Primary Payment Gateway Latency Surge</text>
    <text x="0" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Opened 18 mins ago by Sarah Jenkins • Service: Payments Gateway Cluster</text>

    <!-- Top Action Buttons -->
    <g transform="translate(680, 4)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#10b981"/>
      <text x="65" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Resolve Ticket</text>
      <rect x="140" y="0" width="150" height="34" rx="8" fill="#3b82f6"/>
      <text x="215" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Propose Resolution</text>
    </g>

    <!-- SLA Countdown Banner Card -->
    <g transform="translate(0, 62)" filter="url(#wShadow)">
      <rect width="990" height="64" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <text x="20" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">ACTIVE SLA: P1 CRITICAL RESOLUTION (4h Target)</text>
      <!-- Time left -->
      <text x="830" y="38" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#38bdf8">3h 42m Left</text>
      <!-- Progress Bar -->
      <rect x="20" y="38" width="790" height="10" rx="5" fill="#312e81"/>
      <rect x="20" y="38" width="118" height="10" rx="5" fill="#38bdf8"/>
    </g>

    <!-- Purr-Assist AI Summary Card -->
    <g transform="translate(0, 138)" filter="url(#wShadow)">
      <rect width="990" height="88" rx="10" fill="url(#aiCard)" stroke="#818cf8" stroke-width="1.2"/>
      <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#e0e7ff">✨ Purr-Assist AI • Executive Handoff Synthesis</text>
      <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#c7d2fe">Symptoms: Payment webhook latency spiked to 4,200ms following border router BGP flap at 14:12 UTC.</text>
      <text x="20" y="68" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Recommended Action: Verify failover route via us-east-2 secondary tunnel. Pre-filling close notes &amp; resolution code.</text>
      <rect x="850" y="46" width="120" height="28" rx="6" fill="#4338ca"/>
      <text x="910" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Apply Suggestion</text>
    </g>

    <!-- Form Field Grid -->
    <g transform="translate(0, 240)">
      <!-- Left Column Fields -->
      <g>
        <!-- Field 1: State -->
        <rect width="480" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">STATE</text>
        <text x="16" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">In Progress (State 2)</text>

        <!-- Field 2: Assigned To -->
        <g transform="translate(0, 64)">
          <rect width="480" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="16" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">ASSIGNED TO (ENGINEER)</text>
          <text x="16" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Alex Chen (Staff SRE)</text>
        </g>

        <!-- Field 3: CI Component -->
        <g transform="translate(0, 128)">
          <rect width="480" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="16" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">CONFIGURATION ITEM (CMDB)</text>
          <text x="16" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">gw-stripe-primary-01.prod.aws</text>
        </g>
      </g>

      <!-- Right Column: Real-Time Audit / Work Notes Stream -->
      <g transform="translate(510, 0)">
        <rect width="480" height="180" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f1f5f9">Activity Stream &amp; sys_audit Timeline</text>

        <!-- Entry 1 -->
        <g transform="translate(16, 40)">
          <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
          <text x="18" y="9" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Workflow Agent (Auto-Assign)</text>
          <text x="190" y="9" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">14:14 UTC</text>
          <text x="18" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Assigned ticket to Payments SRE primary on-call (Alex Chen).</text>
        </g>

        <!-- Entry 2 -->
        <g transform="translate(16, 85)">
          <circle cx="6" cy="6" r="4" fill="#a855f7"/>
          <text x="18" y="9" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a855f7">sys_audit [priority delta]</text>
          <text x="190" y="9" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">14:12 UTC</text>
          <text x="18" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">priority: changed from "P3 - Moderate" to "P1 - Critical".</text>
        </g>

        <!-- Entry 3 -->
        <g transform="translate(16, 130)">
          <circle cx="6" cy="6" r="4" fill="#10b981"/>
          <text x="18" y="9" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10b981">Sarah Jenkins</text>
          <text x="190" y="9" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">14:10 UTC</text>
          <text x="18" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Customer checkout failures observed in EU and US-East regions.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
