    <!-- Code Editor Canvas -->
    <g transform="translate(0, 42)">
      <rect width="850" height="380" fill="#030712"/>

      <!-- Line Numbers Column -->
      <rect width="46" height="380" fill="#080d1a" stroke="#1e293b" stroke-width="0.5"/>
      <text x="24" y="24" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">1</text>
      <text x="24" y="44" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">2</text>
      <text x="24" y="64" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">3</text>
      <text x="24" y="84" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">4</text>
      <text x="24" y="104" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">5</text>
      <text x="24" y="124" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">6</text>
      <text x="24" y="144" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">7</text>
      <text x="24" y="164" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">8</text>
      <text x="24" y="184" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">9</text>
      <text x="24" y="204" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">10</text>
      <text x="24" y="224" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">11</text>
      <text x="24" y="244" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">12</text>
      <text x="24" y="264" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">13</text>

      <!-- Code Syntax Highlighted Lines -->
      <text x="64" y="24" font-family="monospace" font-size="12" fill="#818cf8">const <tspan fill="#38bdf8">IncidentAutomationUtil</tspan> = Class.create();</text>
      <text x="64" y="44" font-family="monospace" font-size="12" fill="#e2e8f0"><tspan fill="#38bdf8">IncidentAutomationUtil</tspan>.prototype = {</text>
      <text x="84" y="64" font-family="monospace" font-size="12" fill="#38bdf8">initialize: <tspan fill="#c084fc">function</tspan>() {</text>
      <text x="104" y="84" font-family="monospace" font-size="12" fill="#64748b">// Sandboxed initialization in QuickJS WebAssembly Realm</text>
      <text x="104" y="104" font-family="monospace" font-size="12" fill="#f8fafc">gs.log(<tspan fill="#34d399">"IncidentAutomationUtil initialized successfully"</tspan>);</text>
      <text x="84" y="124" font-family="monospace" font-size="12" fill="#e2e8f0">},</text>
      <text x="84" y="144" font-family="monospace" font-size="12" fill="#38bdf8">calculateRiskScore: <tspan fill="#c084fc">function</tspan>(<tspan fill="#fbbf24">priority, urgency, impactedUsers</tspan>) {</text>
      <text x="104" y="164" font-family="monospace" font-size="12" fill="#c084fc">const <tspan fill="#f8fafc">baseWeight</tspan> = (<tspan fill="#f43f5e">6</tspan> - priority) * <tspan fill="#f43f5e">25</tspan>;</text>
      <text x="104" y="184" font-family="monospace" font-size="12" fill="#c084fc">const <tspan fill="#f8fafc">urgencyMultiplier</tspan> = urgency === <tspan fill="#f43f5e">1</tspan> ? <tspan fill="#f43f5e">1.5</tspan> : <tspan fill="#f43f5e">1.0</tspan>;</text>
      <text x="104" y="204" font-family="monospace" font-size="12" fill="#c084fc">return <tspan fill="#f8fafc">Math.min(<tspan fill="#f43f5e">100</tspan>, Math.round((baseWeight + impactedUsers * <tspan fill="#f43f5e">0.2</tspan>) * urgencyMultiplier))</tspan>;</text>
      <text x="84" y="224" font-family="monospace" font-size="12" fill="#e2e8f0">}</text>
      <text x="64" y="244" font-family="monospace" font-size="12" fill="#e2e8f0">};</text>
    </g>

