<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="80" y1="0" x2="80" y2="440" />
    <line x1="160" y1="0" x2="160" y2="440" />
    <line x1="240" y1="0" x2="240" y2="440" />
    <line x1="320" y1="0" x2="320" y2="440" />
    <line x1="400" y1="0" x2="400" y2="440" />
    <line x1="480" y1="0" x2="480" y2="440" />
    <line x1="560" y1="0" x2="560" y2="440" />
    <line x1="640" y1="0" x2="640" y2="440" />
    <line x1="720" y1="0" x2="720" y2="440" />
    <line x1="800" y1="0" x2="800" y2="440" />
    <line x1="880" y1="0" x2="880" y2="440" />
    <line x1="960" y1="0" x2="960" y2="440" />
    <line x1="1040" y1="0" x2="1040" y2="440" />
    <line x1="1120" y1="0" x2="1120" y2="440" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="160" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Top Decorative Badge -->
  <g transform="translate(60, 50)">
    <rect width="210" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="4" fill="#10b981" />
    <text x="30" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ENTERPRISE ITIL PLATFORM</text>
  </g>

  <!-- Cat Cyber Shield Logo -->
  <g transform="translate(60, 105)" filter="url(#glow)">
    <rect width="76" height="76" rx="20" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="2" />
    <!-- Cat Ears & Shield Path -->
    <path d="M 23 48 L 23 34 L 31 40 L 45 40 L 53 34 L 53 48 C 53 58 38 65 38 65 C 38 65 23 58 23 48 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 32 49 L 38 54 L 44 49" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="31" cy="46" r="2" fill="#38bdf8" />
    <circle cx="45" cy="46" r="2" fill="#c084fc" />
  </g>

  <!-- Title & Subtitle -->
  <text x="150" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Service<tspan fill="url(#primaryGrad)">Meow</tspan>
  </text>
  <text x="150" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
    Modern, Open-Source Enterprise ITIL &amp; Digital Service Operations Platform
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(60, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">⚡ Next.js 15 (App)</text>

    <!-- Pill 2 -->
    <rect x="140" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="154" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8">🐘 PostgreSQL 16</text>

    <!-- Pill 3 -->
    <rect x="275" y="0" width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="289" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a78bfa">🛡️ QuickJS WASM Sandbox</text>

    <!-- Pill 4 -->
    <rect x="455" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="469" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">🎨 Material Design 3</text>

    <!-- Pill 5 -->
    <rect x="610" y="0" width="175" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="624" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f472b6">🤖 Autonomous Agent</text>
  </g>

  <!-- Right Side Interactive Telemetry Card (Glassmorphic) -->
  <g transform="translate(840, 45)" filter="url(#softShadow)">
    <rect width="300" height="340" rx="18" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

    <!-- Terminal Header Dots -->
    <circle cx="24" cy="24" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="24" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="24" r="5" fill="#10b981" opacity="0.8" />
    <text x="76" y="28" font-family="monospace" font-size="11" fill="#64748b">telemetry.live</text>

    <!-- Stat 1: SLA Compliance -->
    <g transform="translate(20, 55)">
      <rect width="260" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Active SLA Compliance</text>
      <text x="16" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#10b981">99.98%</text>
      <!-- Sparkline -->
      <polyline points="180,38 195,34 210,36 225,28 240,25 250,22" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Stat 2: Sandbox Security -->
    <g transform="translate(20, 120)">
      <rect width="260" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">WASM Sandbox Escapes</text>
      <text x="16" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">0 Defeats (Isolated)</text>
    </g>

    <!-- Stat 3: Automated Test Suite -->
    <g transform="translate(20, 185)">
      <rect width="260" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Vitest Test Suite</text>
      <text x="16" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#a855f7">59 / 59 Passed 100%</text>
    </g>

    <!-- Stat 4: Architecture Core -->
    <g transform="translate(20, 250)">
      <rect width="260" height="66" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Background Worker Daemon</text>
      <circle cx="22" cy="42" r="4" fill="#10b981" />
      <text x="32" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Scheduler: Active (15s Tick)</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 260)">
    <!-- Column 1 -->
    <g>
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">40+</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">Relational Tables</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(130, 0)">
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#818cf8">66</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">API &amp; UI Routes</text>
    </g>

    <!-- Column 3 -->
    <g transform="translate(240, 0)">
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#c084fc">7</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">M3 Theme Palettes</text>
    </g>

    <!-- Column 4 -->
    <g transform="translate(360, 0)">
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#34d399">100%</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">Zero-Trust RBAC</text>
    </g>

    <!-- Column 5 -->
    <g transform="translate(480, 0)">
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#f43f5e">&lt; 15ms</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">Edge Evaluation</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="436" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
