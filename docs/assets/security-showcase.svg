<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>
    <filter id="secShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="520" rx="14" fill="url(#secBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(40, 40)">
    <rect width="150" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="75" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">DEFENSE-IN-DEPTH</text>
    <text x="0" y="56" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">ServiceMeow Zero-Trust Security Architecture</text>
    <text x="0" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Multi-layer verification guarding against RCE, privilege escalation, credential leakage, and unauthorized access.</text>
  </g>

  <!-- 4 Pillar Cards -->
  <g transform="translate(40, 150)">
    <!-- Pillar 1: Edge & Sessions -->
    <g filter="url(#secShadow)">
      <rect width="235" height="320" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#0369a1"/>
      <text x="38" y="44" font-size="18" text-anchor="middle">🛡️</text>
      <text x="20" y="82" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">1. Edge &amp; Session</text>
      <text x="20" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Next.js Middleware</text>

      <text x="20" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Pure Web Crypto HMAC-SHA256 token verification.</text>
      <text x="20" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Server-side sessions with live DB role lookup on each tick.</text>
      <text x="20" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Strips spoofed client headers (`x-auth-role`, `x-user-id`).</text>
      <text x="20" y="226" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Demotions take effect instantly on the next request.</text>

      <rect x="20" y="270" width="195" height="28" rx="6" fill="#1e293b"/>
      <text x="117" y="288" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">crypto.subtle (Edge)</text>
    </g>

    <!-- Pillar 2: QuickJS WASM Sandbox -->
    <g transform="translate(255, 0)" filter="url(#secShadow)">
      <rect width="235" height="320" rx="12" fill="#0f172a" stroke="#ec4899" stroke-width="1.2"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#be185d"/>
      <text x="38" y="44" font-size="18" text-anchor="middle">⚡</text>
      <text x="20" y="82" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">2. WASM Isolation</text>
      <text x="20" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f472b6">QuickJS Sandboxing</text>

      <text x="20" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• True WebAssembly guest memory sandbox (no V8 escapes).</text>
      <text x="20" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Blocks prototype chain &amp; constructor injection attacks.</text>
      <text x="20" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Synchronous host calls with strict JSON marshaling.</text>
      <text x="20" y="226" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• 16MB memory limit &amp; loop interruption deadline.</text>

      <rect x="20" y="270" width="195" height="28" rx="6" fill="#1e293b"/>
      <text x="117" y="288" font-family="monospace" font-size="11" fill="#f472b6" text-anchor="middle">quickjs-emscripten</text>
    </g>

    <!-- Pillar 3: System Table Default-Deny -->
    <g transform="translate(510, 0)" filter="url(#secShadow)">
      <rect width="235" height="320" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#7e22ce"/>
      <text x="38" y="44" font-size="18" text-anchor="middle">🔒</text>
      <text x="20" y="82" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">3. Identity Defense</text>
      <text x="20" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c084fc">ACL &amp; Table API Guards</text>

      <text x="20" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• System tables (sys_*) default-DENY for non-read ops.</text>
      <text x="20" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Table API hardcoded check blocks non-admin identity writes.</text>
      <text x="20" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Wildcard (*) ACLs can never grant writes to sys_* tables.</text>
      <text x="20" y="226" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Prevents self-promotion &amp; unauthorized group assignments.</text>

      <rect x="20" y="270" width="195" height="28" rx="6" fill="#1e293b"/>
      <text x="117" y="288" font-family="monospace" font-size="11" fill="#c084fc" text-anchor="middle">Default-Deny sys_*</text>
    </g>

    <!-- Pillar 4: Credential Security -->
    <g transform="translate(765, 0)" filter="url(#secShadow)">
      <rect width="235" height="320" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#047857"/>
      <text x="38" y="44" font-size="18" text-anchor="middle">🔑</text>
      <text x="20" y="82" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">4. Credential Vault</text>
      <text x="20" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399">Prisma Global Omission</text>

      <text x="20" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Prisma global omission: passwordHash never leaked.</text>
      <text x="20" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Zero hardcoded passwords: env-driven or random bytes.</text>
      <text x="20" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Slidng-window rate limiter: 5 failed logins triggers lockout.</text>
      <text x="20" y="226" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Random one-time temporaryPassword on user creation.</text>

      <rect x="20" y="270" width="195" height="28" rx="6" fill="#1e293b"/>
      <text x="117" y="288" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">omit: { passwordHash }</text>
    </g>
  </g>
</svg>
