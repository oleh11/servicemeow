<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="wasmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="50" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">ServiceMeow Platform Architecture</text>
  <text x="50" y="74" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Multi-Tier Zero-Trust Enterprise Design with WebAssembly Script Isolation</text>

  <!-- TIER 1: CLIENT EXPERIENCES -->
  <g transform="translate(50, 110)">
    <!-- Group Box -->
    <rect width="1000" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">TIER 1: CLIENT SURFACES (NEXT.JS 15 APP ROUTER + REACT 19)</text>

    <!-- Fulfiller Workspace -->
    <g transform="translate(20, 36)" filter="url(#shadow)">
      <rect width="300" height="60" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="16" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Fulfiller Workspace</text>
      <text x="16" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Dockable Tabs • Kanban • CMDB Graph</text>
    </g>

    <!-- Self-Service Portal -->
    <g transform="translate(350, 36)" filter="url(#shadow)">
      <rect width="300" height="60" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="16" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Self-Service Portal</text>
      <text x="16" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Service Catalog • Cart • 90d Uptime Status</text>
    </g>

    <!-- Studio Low-Code IDE -->
    <g transform="translate(680, 36)" filter="url(#shadow)">
      <rect width="300" height="60" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="16" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Studio Configuration Center</text>
      <text x="16" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Schema Builder • ACLs • Monaco Editor</text>
    </g>
  </g>

  <!-- Connection Line 1 -->
  <line x1="550" y1="220" x2="550" y2="250" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="550,255 545,245 555,245" fill="#818cf8"/>

  <!-- TIER 2: EDGE SECURITY & ROUTE GUARD -->
  <g transform="translate(50, 260)" filter="url(#shadow)">
    <rect width="1000" height="70" rx="10" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="24" y="28" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#e9d5ff">Edge &amp; Session Route Guard (middleware.ts)</text>
    <text x="24" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">HMAC SHA-256 JWT Verification • Live DB Role Evaluation • Strips Spoofed Headers • System Table Default-Deny</text>
    <!-- Badge -->
    <rect x="860" y="20" width="116" height="28" rx="6" fill="#6d28d9"/>
    <text x="874" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">ZERO-TRUST</text>
  </g>

  <!-- Connection Line 2 -->
  <line x1="550" y1="330" x2="550" y2="360" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="550,365 545,355 555,355" fill="#2dd4bf"/>

  <!-- TIER 3: BUSINESS LOGIC & APIS + SANDBOX -->
  <g transform="translate(50, 370)">
    <!-- REST APIs & Engines -->
    <g filter="url(#shadow)">
      <rect width="580" height="130" rx="10" fill="#134e4a" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ccfbf1">Core ITIL Engines &amp; 66 REST Endpoints</text>
      <text x="20" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#99f6e4">• Table API (CRUD with field-level sys_audit delta logging)</text>
      <text x="20" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#99f6e4">• Business Rules Engine (before_insert, after_update, async)</text>
      <text x="20" y="84" font-family="system-ui, sans-serif" font-size="11" fill="#99f6e4">• ACL Evaluation Engine (default-deny on sys_* identity tables)</text>
      <text x="20" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#99f6e4">• Import Sets RFC 4180 CSV Engine &amp; Update Set ALM Exporter</text>
    </g>

    <!-- WASM Sandbox (Isolated) -->
    <g transform="translate(610, 0)" filter="url(#shadow)">
      <rect width="390" height="130" rx="10" fill="#500724" stroke="#ec4899" stroke-width="1.5"/>
      <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#fce7f3">🛡️ QuickJS WASM Sandbox</text>
      <text x="20" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#fbcfe8">• WebAssembly isolated guest memory heap</text>
      <text x="20" y="64" font-family="system-ui, sans-serif" font-size="11" fill="#fbcfe8">• Zero Node.js process / require / V8 escapes</text>
      <text x="20" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#fbcfe8">• JSON boundary marshaling with copyBack()</text>
      <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#fbcfe8">• Hard 16MB memory limit &amp; loop timeout</text>
    </g>
  </g>

  <!-- Connection Line 3 -->
  <line x1="340" y1="500" x2="340" y2="540" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="340,545 335,535 345,535" fill="#38bdf8"/>

  <line x1="800" y1="500" x2="800" y2="540" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="800,545 795,535 805,535" fill="#fbbf24"/>

  <!-- TIER 4: PERSISTENCE & DAEMON -->
  <g transform="translate(50, 550)">
    <!-- PostgreSQL Engine -->
    <g filter="url(#shadow)">
      <rect width="580" height="90" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#dbeafe">PostgreSQL 16 Enterprise Database</text>
      <text x="20" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#bfdbfe">Prisma ORM • 40+ Relational Models • Foreign Keys &amp; Indexes</text>
      <text x="20" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#93c5fd">Global Password Hash Omission (`omit: { passwordHash: true }`)</text>
    </g>

    <!-- Background Worker Daemon -->
    <g transform="translate(610, 0)" filter="url(#shadow)">
      <rect width="390" height="90" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#fef3c7">⚡ Background Worker (worker.ts)</text>
      <text x="20" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#fde68a">15s Interval Poller • Executes due sys_scheduled_jobs</text>
      <text x="20" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#fde68a">Workflow Agent SLA triage &amp; auto-assignment cycle</text>
    </g>
  </g>

</svg>
